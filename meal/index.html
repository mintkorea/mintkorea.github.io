    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyE7XYw1UMPSzeWrW3mqbcPDeTRiTF5YhEdsweFLYy2HOIYDdiTNEPTeKC4ogK_d0rxcQ/exec";

        // ── 엑셀 업로드 (비밀번호 없이 오픈, AI 미사용) ──────────────────
        let uploadParsedItems = [];

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('open');
        }
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('open');
            document.getElementById('uploadFileInput').value = "";
            document.getElementById('uploadStatus').textContent = "";
            document.getElementById('uploadPreviewWrap').classList.add('hidden');
            uploadParsedItems = [];
        }

        function excelHeaderToIsoDate_(cellText) {
            const m = String(cellText || "").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
            if (!m) return null;
            const [, y, mo, d] = m;
            return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }
        const EXCEL_MEAL_TYPES = ["조식", "간편식", "중식", "석식", "야식"];
        function excelDetectMealType_(label) {
            const clean = String(label || "").replace(/\s+/g, "");
            for (const t of EXCEL_MEAL_TYPES) if (clean.startsWith(t)) return t;
            return null;
        }
        function excelIsCalorieLabel_(label) {
            return String(label || "").replace(/\s+/g, "").startsWith("열량");
        }
        function excelIsNote_(l) { return /^\(.*\)$/.test(l); }
        function excelIsStarred_(l) { return /^\*[\s\S]*\*$/.test(l); }
        function excelIsAmp_(l) { return l.startsWith("&"); }
        function excelAtomize_(line) {
            let s = line;
            if (excelIsStarred_(s)) s = s.replace(/^\*/, "").replace(/\*$/, "").trim();
            return s.split(/[,&]/).map(x => x.trim()).filter(Boolean);
        }
        function excelParseBlockColumn_(blockRows, colIdx, date, type) {
            const lineGroups = blockRows.map(row => {
                const cell = row[colIdx];
                if (cell === undefined || cell === null || String(cell).trim() === "") return [];
                return String(cell).split("\n").map(s => s.trim()).filter(s => s !== "");
            });
            const allLines = lineGroups.flat();
            if (allLines.length === 0) return null;

            let mainText = null, mainSourceLine = null, mainIsStarred = false;
            for (const l of allLines) {
                if (excelIsNote_(l)) continue;
                if (excelIsStarred_(l)) {
                    mainSourceLine = l; mainIsStarred = true;
                    mainText = l.replace(/^\*/, "").replace(/\*$/, "").trim();
                    break;
                }
            }
            if (mainText === null) {
                const firstRowLines = lineGroups[0] || [];
                for (let i = firstRowLines.length - 1; i >= 0; i--) {
                    const l = firstRowLines[i];
                    if (excelIsNote_(l) || excelIsAmp_(l)) continue;
                    mainSourceLine = l; break;
                }
                if (mainSourceLine) {
                    if (mainSourceLine.includes(",")) {
                        const parts = mainSourceLine.split(",").map(s => s.trim()).filter(Boolean);
                        mainText = parts[parts.length - 1];
                    } else { mainText = mainSourceLine; }
                }
            }
            if (!mainText) return null;

            let extraFromMain = null;
            if (mainText.includes("&")) {
                const idx = mainText.indexOf("&");
                extraFromMain = mainText.slice(idx + 1).trim();
                mainText = mainText.slice(0, idx).trim();
            }
            let extraFromMainComma = [];
            if (mainIsStarred && mainText.includes(",")) {
                const parts = mainText.split(",").map(s => s.trim()).filter(Boolean);
                mainText = parts[0];
                extraFromMainComma = parts.slice(1);
            }

            const sides = [];
            if (extraFromMain) sides.push(...excelAtomize_(extraFromMain));
            extraFromMainComma.forEach(p => sides.push(...excelAtomize_(p)));

            allLines.forEach(l => {
                if (excelIsNote_(l) || l === mainSourceLine) {
                    if (l === mainSourceLine && !mainIsStarred && l.includes(",")) {
                        const parts = l.split(",").map(s => s.trim()).filter(Boolean);
                        parts.forEach(p => { if (p !== mainText) sides.push(...excelAtomize_(p)); });
                    }
                    return;
                }
                sides.push(...excelAtomize_(l));
            });

            return { date, type, main: mainText, all: sides.join(", "), comment: "" };
        }

        async function parseExcelFile(file) {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });

            let headerRowIdx = -1;
            for (let i = 0; i < rows.length; i++) {
                if (String(rows[i][0] || "").replace(/\s+/g, "") === "구분") { headerRowIdx = i; break; }
            }
            if (headerRowIdx === -1) throw new Error("헤더 행('구분')을 찾지 못했습니다. 엑셀 양식이 다른 것 같습니다.");

            const headerRow = rows[headerRowIdx];
            const dateColumns = [];
            for (let c = 1; c < headerRow.length; c++) {
                const iso = excelHeaderToIsoDate_(headerRow[c]);
                if (iso) dateColumns.push({ colIdx: c, date: iso });
            }
            if (dateColumns.length === 0) throw new Error("날짜 열을 찾지 못했습니다.");

            const blocks = [];
            let current = null;
            for (let i = headerRowIdx + 1; i < rows.length; i++) {
                const row = rows[i];
                const label = row[0];
                if (label && String(label).trim() !== "") {
                    const mealType = excelDetectMealType_(label);
                    if (mealType) { current = { type: mealType, rows: [] }; blocks.push(current); }
                    else if (excelIsCalorieLabel_(label)) { current = null; }
                    else { break; }
                }
                if (current) current.rows.push(row);
            }

            const items = [];
            blocks.forEach(block => {
                dateColumns.forEach(({ colIdx, date }) => {
                    const item = excelParseBlockColumn_(block.rows, colIdx, date, block.type);
                    if (item) items.push(item);
                });
            });
            if (items.length === 0) throw new Error("표에서 식단 항목을 하나도 찾지 못했습니다.");
            return items;
        }

        async function handleUploadFile() {
            const file = document.getElementById('uploadFileInput').files[0];
            const status = document.getElementById('uploadStatus');
            document.getElementById('uploadPreviewWrap').classList.add('hidden');
            if (!file) return;

            status.textContent = "⏳ 엑셀 파일을 읽는 중입니다...";
            try {
                uploadParsedItems = await parseExcelFile(file);
                const body = document.getElementById('uploadPreviewBody');
                body.innerHTML = uploadParsedItems.map(it =>
                    `<tr class="border-t border-slate-100"><td class="p-1.5">${it.date}</td><td class="p-1.5">${it.type}</td><td class="p-1.5">${it.main}</td></tr>`
                ).join('');
                document.getElementById('uploadPreviewWrap').classList.remove('hidden');
                status.textContent = `✅ ${uploadParsedItems.length}건을 읽었습니다. 확인 후 저장해주세요.`;
            } catch (err) {
                status.innerHTML = `<span style="color:#dc2626">❌ ${err.message}</span>`;
            }
        }

        async function submitUpload() {
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadSubmitBtn');
            btn.disabled = true;
            status.textContent = "⏳ 저장 중입니다...";
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "saveConfirmedData", items: uploadParsedItems })
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.message || "저장 실패");
                status.innerHTML = `<span style="color:#1d4ed8">${data.message}</span>`;
                localStorage.removeItem("meal_db_cache"); // 캐시 지우고 최신 데이터 다시 불러오기
                await loadData();
                setTimeout(closeUploadModal, 1200);
            } catch (err) {
                status.innerHTML = `<span style="color:#dc2626">❌ ${err.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }

        const shiftConfig = { baseDate: new Date('2026-03-09'), pattern: [{ name: 'C', color: '#3B82F6' }, { name: 'A', color: '#F59E0B' }, { name: 'B', color: '#EF4444' }] };
        const mealMeta = { '조식': { color: '#E65D4F', inactiveBg: '#F9DEDC', startTime: '07:00', endTime: '09:00' }, '간편식': { color: '#F2A134', inactiveBg: '#FDF2E2', startTime: '07:00', endTime: '09:30' }, '중식': { color: '#6AB04C', inactiveBg: '#EDF6E9', startTime: '11:20', endTime: '14:00' }, '석식': { color: '#3498DB', inactiveBg: '#EBF3FA', startTime: '17:20', endTime: '19:20' }, '야식': { color: '#8E44AD', inactiveBg: '#F0ECF7', startTime: '18:00', endTime: '20:00' } };
        const MEAL_ORDER = ["조식", "간편식", "중식", "석식", "야식"];
        
        let allData = {}; 
        let currentDate = new Date(); 
        let activeTab = "중식";
        let fp; // [추가] Flatpickr 인스턴스 저장용

        function initDateFromURL() {
            const params = new URLSearchParams(window.location.search);
            const dateParam = params.get('date');
            if (dateParam) {
                const parsedDate = new Date(dateParam);
                if (!isNaN(parsedDate)) { currentDate = parsedDate; }
            }
        }

        async function loadData() {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            const backup = localStorage.getItem("meal_db_cache");
            
            if (backup) {
                allData = JSON.parse(backup);
                dot.className = "status-dot dot-sync";
                txt.innerText = "OFF(LOCAL)";
                txt.className = "text-[9px] font-black text-amber-500 tracking-tight";
                updateUI();
            }

            try {
                const res = await fetch(GAS_URL + "?t=" + new Date().getTime());
                const freshData = await res.json();
                allData = freshData;
                localStorage.setItem("meal_db_cache", JSON.stringify(freshData));
                dot.className = "status-dot dot-online";
                txt.innerText = "ON(SYNCED)";
                txt.className = "text-[9px] font-black text-emerald-500 tracking-tight";
                updateUI(); 
            } catch (e) { console.error("Data load failed", e); }
        }

        function updateUI() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1, d = currentDate.getDate();
            const weekIdx = currentDate.getDay();
            const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
            
            // 날짜 텍스트 업데이트
            document.getElementById('dateDisplay').innerHTML = `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} <span class="${weekIdx===0?'day-sun':(weekIdx===6?'day-sat':'')}">(${weekNames[weekIdx]})</span>`;
            
            // [수정] Flatpickr 날짜 동기화
            if(fp) fp.setDate(currentDate, false);
            
            const targetDate = new Date(currentDate); targetDate.setHours(0,0,0,0);
            const baseDate = new Date(shiftConfig.baseDate); baseDate.setHours(0,0,0,0);
            const diffDays = Math.floor((targetDate - baseDate) / 86400000);
            const shift = shiftConfig.pattern[((diffDays % 3) + 3) % 3];
            const badge = document.getElementById('shiftBadge'); badge.innerText = `${shift.name}조 근무`; badge.style.backgroundColor = shift.color;

            const tabsContainer = document.getElementById('tabs-container'); tabsContainer.innerHTML = '';
            MEAL_ORDER.forEach(meal => {
                const isActive = meal === activeTab; const meta = mealMeta[meal];
                const btn = document.createElement('button'); btn.innerText = meal; btn.className = `py-3.5 text-[11px] font-black rounded-t-2xl tab-transition`;
                btn.style.backgroundColor = isActive ? meta.color : meta.inactiveBg; btn.style.color = isActive ? 'white' : '#64748b';
                btn.onclick = () => { activeTab = meal; updateUI(); }; tabsContainer.appendChild(btn);
            });

            const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayData = allData[key] || allData[`${y}-${m}-${d}`] || null;
            let info = null; 
            if (dayData) { 
                for (const k in dayData) { 
                    if (k.replace(/[^ㄱ-ㅎ가-힣]/g, "") === activeTab) { info = dayData[k]; break; } 
                } 
            }
            
            const menuCard = document.getElementById('menu-card'); menuCard.style.borderColor = mealMeta[activeTab].color;
            document.getElementById('main-menu').innerText = info?.menu || "식단 정보가 없습니다.";
            document.getElementById('sub-menu').innerText = info?.side || "-";
            document.getElementById('comment-text').innerText = info?.comment || "오늘도 즐거운 하루 되세요! 😊";
            updateStatusMsg();
        }

        function updateStatusMsg() {
            const now = new Date(); 
            const isToday = currentDate.toDateString() === now.toDateString();
            const m = currentDate.getMonth() + 1, d = currentDate.getDate();
            
            if (!isToday) { 
                document.getElementById('timer-text').innerText = `${m}/${d} ${activeTab} 식단`; 
                document.getElementById('timer-icon').innerText = "📅"; return; 
            }
            
            const meta = mealMeta[activeTab]; 
            const [sH, sM] = meta.startTime.split(':').map(Number); 
            const [eH, eM] = meta.endTime.split(':').map(Number);
            const start = new Date(); start.setHours(sH, sM, 0); 
            const end = new Date(); end.setHours(eH, eM, 0);
            
            if (now < start) { 
                const diffMin = Math.ceil((start - now) / 60000); 
                document.getElementById('timer-text').innerText = `${activeTab}까지 ${Math.floor(diffMin/60)}h ${diffMin%60}m 남음`; 
                document.getElementById('timer-icon').innerText = "⏳"; 
            } else if (now <= end) { 
                document.getElementById('timer-text').innerText = `${activeTab} 배식 중`; 
                document.getElementById('timer-icon').innerText = "🍽️"; 
            } else { 
                document.getElementById('timer-text').innerText = `${activeTab} 배식 종료`; 
                document.getElementById('timer-icon').innerText = "✅"; 
            }
        }

        function changeDate(n) { currentDate.setDate(currentDate.getDate() + n); updateUI(); }
        function goToday() { currentDate = new Date(); activeTab = autoMeal(); updateUI(); }
        function autoMeal() { const h = new Date().getHours(); if (h < 9) return "조식"; if (h < 14) return "중식"; return "석식"; }
        
        window.onload = () => { 
            initDateFromURL();
            if (!window.location.search.includes('date')) { activeTab = autoMeal(); }
            
            // [수정] 인덱스와 동일한 Flatpickr 초기화
            fp = flatpickr("#calendarTrigger", {
                locale: "ko",
                dateFormat: "Y-m-d",
                defaultDate: currentDate,
                disableMobile: true, // 인덱스 디자인 유지를 위해 필수
                onChange: (dates) => {
                    if(dates.length) {
                        currentDate = dates[0];
                        updateUI();
                    }
                }
            });

            loadData(); 
        };
        setInterval(updateStatusMsg, 60000);
    </script>
</body>
</html>
